<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Rabina Times</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" />
  <style>
    :root {
      --bg: #000000;
      --c: #e53935;
      --glow-strong: rgba(229, 57, 53, 0.75);
      --glow-soft: rgba(229, 57, 53, 0.25);
      --btn-border: rgba(229, 57, 53, 0.45);
      --btn-bg: rgba(229, 57, 53, 0.06);
      --btn-hover: rgba(229, 57, 53, 0.18);
      --btn-shadow: rgba(229, 57, 53, 0.35);
      --swatch-ring: rgba(255, 255, 255, 0.35);
      --swatch-hover-ring: #ffffff;
    }

    body.light-mode {
      --bg: #ffffff;
      --swatch-ring: rgba(0, 0, 0, 0.28);
      --swatch-hover-ring: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; width: 100%; }

    body {
      background: var(--bg);
      color: var(--c);
      font-family: 'DSEG7-Classic', 'Courier New', monospace;
      font-weight: 900;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: max(clamp(0.75rem, 3dvh, 2rem), env(safe-area-inset-top))
               max(clamp(0.75rem, 3vw, 2.5rem), env(safe-area-inset-right))
               max(clamp(0.75rem, 3dvh, 2rem), env(safe-area-inset-bottom))
               max(clamp(0.75rem, 3vw, 2.5rem), env(safe-area-inset-left));
      overflow-x: hidden;
      overscroll-behavior-y: auto;
      touch-action: pan-y;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .clock-container {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: clamp(0.5rem, 2dvh, 1.35rem);
      width: fit-content;
      max-width: 100%;
    }

    .brand-tag {
      align-self: flex-start;
      margin-bottom: -0.25rem;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: clamp(0.65rem, 1.6vw, 0.8rem);
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.48;
      pointer-events: none;
      white-space: nowrap;
    }

    .time-main {
      font-size: clamp(2.8rem, min(15.5vw, 15dvh), 10rem);
      letter-spacing: 0.06em;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow: 0 0 2px var(--glow-strong), 0 0 12px var(--glow-soft);
    }

    .time-sub {
      display: inline-flex;
      flex-wrap: nowrap;
      align-items: baseline;
      justify-content: center;
      gap: 0.65em;
      font-family: 'DSEG14-Classic', 'Courier New', monospace;
      font-size: clamp(1.2rem, min(5.5vw, 6dvh), 3.4rem);
      letter-spacing: 0.1em;
      line-height: 1.15;
      white-space: nowrap;
      text-shadow: 0 0 1.5px var(--glow-strong), 0 0 9px var(--glow-soft);
    }

    #ampm {
      display: inline-block;
      min-width: 2.2ch;
      text-align: center;
    }

    #ampm.is-hidden {
      visibility: hidden;
    }

    .time-sub .seg-num {
      font-family: 'DSEG7-Classic', 'Courier New', monospace;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(0.65rem, 2.5vw, 1.25rem);
      margin-top: clamp(0.65rem, 2.5dvh, 1.5rem);
    }

    .control-btn {
      width: clamp(44px, 11vw, 54px);
      height: clamp(44px, 11vw, 54px);
      border-radius: 50%;
      border: 1.5px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--c);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 900;
      font-size: clamp(0.75rem, 2.2vw, 0.9rem);
      letter-spacing: 0.02em;
      transition: background-color 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .control-btn:hover, .control-btn:focus-visible {
      background: var(--btn-hover);
      border-color: var(--c);
      box-shadow: 0 0 12px var(--btn-shadow);
    }

    .control-btn:active { transform: scale(0.93); }

    .control-btn svg {
      width: clamp(20px, 5vw, 24px);
      height: clamp(20px, 5vw, 24px);
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .color-toggle-btn {
      background: var(--c);
      border-color: var(--swatch-ring);
      box-shadow: 0 0 10px var(--glow-soft);
    }

    .color-toggle-btn:hover, .color-toggle-btn:focus-visible {
      background: var(--c);
      border-color: var(--swatch-hover-ring);
      box-shadow: 0 0 14px var(--glow-strong);
    }

    @media (orientation: landscape) {
      .clock-container { gap: clamp(0.35rem, 1.8dvh, 1.1rem); }
      .time-main { font-size: clamp(3.5rem, min(17vw, 38dvh), 13.5rem); }
      .time-sub { font-size: clamp(1.35rem, min(5.8vw, 13dvh), 4.2rem); }
      .controls { margin-top: clamp(0.4rem, 1.8dvh, 1rem); }
    }

    @media (orientation: portrait) {
      .time-main { font-size: clamp(2.8rem, min(15.5vw, 13dvh), 8rem); }
      .time-sub { font-size: clamp(1.15rem, min(5.2vw, 5.2dvh), 3rem); }
    }

    @media (hover: none) and (pointer: coarse) {
      :root:fullscreen body {
        padding-left: max(clamp(2.25rem, 5.5vw, 4rem), env(safe-area-inset-left));
        padding-right: max(clamp(2.25rem, 5.5vw, 4rem), env(safe-area-inset-right));
      }
      :root:fullscreen .time-main { font-size: clamp(2.6rem, min(14vw, 31dvh), 11rem); }
      :root:fullscreen .time-sub { font-size: clamp(1.15rem, min(5vw, 11dvh), 3.6rem); }
      :root:fullscreen .control-btn { width: clamp(40px, 9.5vw, 48px); height: clamp(40px, 9.5vw, 48px); }
      :root:fullscreen .control-btn svg { width: clamp(18px, 4.4vw, 21px); height: clamp(18px, 4.4vw, 21px); }
    }

    /* Windows / Desktop: Default and Fullscreen consistent smaller scale */
    @media (hover: hover) and (pointer: fine) {
      .time-main { font-size: clamp(3rem, min(14.5vw, 32dvh), 11.25rem); }
      .time-sub { font-size: clamp(1.25rem, min(5.2vw, 11.5dvh), 3.75rem); }
      .control-btn { width: clamp(40px, 10vw, 48px); height: clamp(40px, 10vw, 48px); }
      .control-btn svg { width: clamp(18px, 4.4vw, 21px); height: clamp(18px, 4.4vw, 21px); }
    }
  </style>
</head>
