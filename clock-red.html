<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Digital Clock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" />
  <style>
    :root {
      --c: #e53935;
      --glow-strong: rgba(229, 57, 53, 0.75);
      --glow-soft: rgba(229, 57, 53, 0.25);
      --btn-border: rgba(229, 57, 53, 0.45);
      --btn-bg: rgba(229, 57, 53, 0.06);
      --btn-hover: rgba(229, 57, 53, 0.18);
      --btn-shadow: rgba(229, 57, 53, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; width: 100%; }

    body {
      background: #000;
      color: var(--c);
      font-family: 'DSEG7-Classic', 'Courier New', monospace;
      font-weight: 900;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: max(clamp(0.75rem, 3dvh, 2rem), env(safe-area-inset-top))
               max(clamp(0.75rem, 3vw, 2.5rem), env(safe-area-inset-right))
               max(clamp(0.75rem, 3dvh, 2rem), env(safe-area-inset-bottom))
               max(clamp(0.75rem, 3vw, 2.5rem), env(safe-area-inset-left));
      overflow-x: hidden;
      overscroll-behavior-y: auto;
      touch-action: pan-y;
      user-select: none;
    }

    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: clamp(0.5rem, 2dvh, 1.35rem);
      width: 100%;
    }

    .time-main {
      font-size: clamp(2.8rem, min(15.5vw, 15dvh), 10rem);
      letter-spacing: 0.06em;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow: 0 0 2px var(--glow-strong), 0 0 12px var(--glow-soft);
    }

    .time-sub {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.65em;
      font-family: 'DSEG14-Classic', 'Courier New', monospace;
      font-size: clamp(1.5rem, min(7vw, 7dvh), 4.25rem);
      letter-spacing: 0.1em;
      line-height: 1.15;
      text-shadow: 0 0 1.5px var(--glow-strong), 0 0 9px var(--glow-soft);
    }

    .controls, .color-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    .controls {
      gap: clamp(0.85rem, 3.5vw, 1.5rem);
      margin-top: clamp(0.65rem, 2.5dvh, 1.5rem);
    }

    .control-btn {
      width: clamp(44px, 11vw, 54px);
      height: clamp(44px, 11vw, 54px);
      border-radius: 50%;
      border: 1.5px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--c);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .control-btn:hover, .control-btn:focus-visible {
      background: var(--btn-hover);
      border-color: var(--c);
      box-shadow: 0 0 12px var(--btn-shadow);
    }

    .control-btn:active { transform: scale(0.93); }

    .control-btn svg {
      width: clamp(20px, 5vw, 24px);
      height: clamp(20px, 5vw, 24px);
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .color-controls {
      gap: clamp(0.65rem, 2.5vw, 1.1rem);
      margin-top: clamp(0.45rem, 1.6dvh, 0.9rem);
    }

    .color-btn {
      width: clamp(26px, 6.5vw, 32px);
      height: clamp(26px, 6.5vw, 32px);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.28);
      background: var(--swatch);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    }

    .color-btn:hover, .color-btn:focus-visible { transform: scale(1.08); border-color: #fff; }
    .color-btn.active { border-color: #fff; box-shadow: 0 0 10px var(--swatch); transform: scale(1.12); }

    .color-btn[data-color="red"]    { --swatch: #e53935; }
    .color-btn[data-color="blue"]   { --swatch: #29b6f6; }
    .color-btn[data-color="green"]  { --swatch: #00e676; }
    .color-btn[data-color="yellow"] { --swatch: #ffea00; }
    .color-btn[data-color="white"]  { --swatch: #ffffff; }

    @media (orientation: landscape) {
      .clock-container { gap: clamp(0.35rem, 1.8dvh, 1.1rem); }
      .time-main { font-size: clamp(3.5rem, min(17vw, 38dvh), 13.5rem); }
      .time-sub { font-size: clamp(1.75rem, min(7.5vw, 16dvh), 5.5rem); }
      .controls { margin-top: clamp(0.4rem, 1.8dvh, 1rem); }
    }

    @media (orientation: portrait) {
      .time-main { font-size: clamp(2.8rem, min(15.5vw, 13dvh), 8rem); }
      .time-sub { font-size: clamp(1.5rem, min(7vw, 6dvh), 3.75rem); }
    }

    @media (hover: none) and (pointer: coarse) {
      :root:fullscreen body {
        padding-left: max(clamp(2.25rem, 5.5vw, 4rem), env(safe-area-inset-left));
        padding-right: max(clamp(2.25rem, 5.5vw, 4rem), env(safe-area-inset-right));
      }
      :root:fullscreen .time-main { font-size: clamp(2.6rem, min(14vw, 31dvh), 11rem); }
      :root:fullscreen .time-sub { font-size: clamp(1.35rem, min(6.2vw, 13dvh), 4.5rem); }
      :root:fullscreen .control-btn { width: clamp(40px, 9.5vw, 48px); height: clamp(40px, 9.5vw, 48px); }
      :root:fullscreen .control-btn svg { width: clamp(18px, 4.4vw, 21px); height: clamp(18px, 4.4vw, 21px); }
      :root:fullscreen .color-btn { width: clamp(22px, 5.5vw, 28px); height: clamp(22px, 5.5vw, 28px); }
    }

    /* Windows / Desktop: Default and Fullscreen consistent smaller scale */
    @media (hover: hover) and (pointer: fine) {
      .time-main { font-size: clamp(3rem, min(14.5vw, 32dvh), 11.25rem); }
      .time-sub { font-size: clamp(1.45rem, min(6.4vw, 13.5dvh), 4.6rem); }
      .control-btn { width: clamp(40px, 10vw, 48px); height: clamp(40px, 10vw, 48px); }
      .control-btn svg { width: clamp(18px, 4.4vw, 21px); height: clamp(18px, 4.4vw, 21px); }
      .color-btn { width: clamp(24px, 6vw, 28px); height: clamp(24px, 6vw, 28px); }
    }
  </style>
</head>
<body>
  <main class="clock-container">
    <div id="time-main" class="time-main">05:20:51</div>
    <div class="time-sub">
      <span id="ampm">AM</span>
      <span id="timezone">GMT+8</span>
    </div>

    <nav class="controls" aria-label="Clock Controls">
      <a href="https://rorabina.github.io/" class="control-btn" title="Rorabina Home" aria-label="Rorabina Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z" /></svg>
      </a>
      <button type="button" id="fullscreen-btn" class="control-btn" title="Toggle Fullscreen Landscape" aria-label="Toggle Fullscreen Landscape">
        <svg id="fullscreen-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" /></svg>
      </button>
      <a href="https://rorabina.github.io/web-utilities.html" class="control-btn" title="Web Utilities" aria-label="Web Utilities">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
      </a>
    </nav>

    <div class="color-controls" role="group" aria-label="Clock Color Selector">
      <button type="button" class="color-btn active" data-color="red" title="Red" aria-label="Red color"></button>
      <button type="button" class="color-btn" data-color="blue" title="Blue" aria-label="Blue color"></button>
      <button type="button" class="color-btn" data-color="green" title="Green" aria-label="Green color"></button>
      <button type="button" class="color-btn" data-color="yellow" title="Yellow" aria-label="Yellow color"></button>
      <button type="button" class="color-btn" data-color="white" title="White" aria-label="White color"></button>
    </div>
  </main>

  <script>
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    ['touchstart', 'touchmove', 'gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => {
      document.addEventListener(ev, (e) => {
        if (!e.touches || e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    });

    const updateClock = () => {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = String((h % 12) || 12).padStart(2, '0');
      const tz = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' })
        .formatToParts(now).find((p) => p.type === 'timeZoneName')?.value || '';

      document.getElementById('time-main').textContent = `${h}:${m}:${s}`;
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('timezone').textContent = tz;
    };
    updateClock();
    setInterval(updateClock, 1000);

    const THEMES = {
      red:    ['#e53935', '229, 57, 53'],
      blue:   ['#29b6f6', '41, 182, 246'],
      green:  ['#00e676', '0, 230, 118'],
      yellow: ['#ffea00', '255, 234, 0'],
      white:  ['#ffffff', '255, 255, 255']
    };
    const colorBtns = document.querySelectorAll('.color-btn');

    const applyTheme = (key) => {
      const [hex, rgb] = THEMES[key] || THEMES.red;
      const st = document.documentElement.style;
      st.setProperty('--c', hex);
      st.setProperty('--glow-strong', `rgba(${rgb}, 0.75)`);
      st.setProperty('--glow-soft', `rgba(${rgb}, 0.25)`);
      st.setProperty('--btn-border', `rgba(${rgb}, 0.45)`);
      st.setProperty('--btn-bg', `rgba(${rgb}, 0.06)`);
      st.setProperty('--btn-hover', `rgba(${rgb}, 0.18)`);
      st.setProperty('--btn-shadow', `rgba(${rgb}, 0.35)`);
      colorBtns.forEach((b) => b.classList.toggle('active', b.dataset.color === key));
      try { localStorage.setItem('clockThemeColor', key); } catch (_) {}
    };

    colorBtns.forEach((b) => b.addEventListener('click', () => applyTheme(b.dataset.color)));
    try {
      const saved = localStorage.getItem('clockThemeColor');
      if (saved && THEMES[saved]) applyTheme(saved);
    } catch (_) {}

    const fsBtn = document.getElementById('fullscreen-btn');
    const fsIcon = document.getElementById('fullscreen-icon');
    const expandPath = 'M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3';
    const compressPath = 'M4 14h6v6m10-10h-6V4m0 6l7-7M3 21l7-7';

    const syncFs = () => {
      const active = Boolean(document.fullscreenElement);
      fsIcon.innerHTML = `<path d="${active ? compressPath : expandPath}" />`;
    };

    fsBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen?.();
          try { await screen.orientation?.lock?.('landscape'); } catch (_) {}
        } else {
          try { screen.orientation?.unlock?.(); } catch (_) {}
          await document.exitFullscreen?.();
        }
      } catch (err) {
        console.warn('Fullscreen toggle failed:', err);
      } finally {
        syncFs();
      }
    });
    document.addEventListener('fullscreenchange', syncFs);
  </script>
</body>
</html>
