<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Clock (Red)</title>
    <link rel="manifest" href="manifest.json">
    <!-- Import authentic segmented digital watch/calculator font from external stylesheet -->
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #e04c3e;
            --footer-color: #a6a99c;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
        }

        /* Segmented calculator display container */
        #live-clock {
            font-family: 'DS-Digital', monospace, sans-serif;
            font-size: clamp(3.5rem, 12vw, 7.5rem);
            font-weight: bold;
            text-align: center;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
        }

        /* Force each character into a uniform fixed-width slot so '1' never shifts */
        #live-clock .char-slot {
            display: inline-block;
            text-align: center;
            width: 0.6em; /* Uniform slot width for all digits and symbols */
        }

        /* Wider slot specifically for spaces between time and AM/PM/PST */
        #live-clock .char-slot.space {
            width: 0.3em;
        }

        footer {
            width: 100%;
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            border-top: none; 
            background-color: var(--bg-color); 
            box-sizing: border-box;
            color: var(--footer-color);
        }

        .footer-links {
            display: flex;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .footer-links a {
            color: var(--footer-color);
            text-decoration: none;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .footer-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .copyright {
            color: var(--footer-color);
            opacity: 0.75;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Live Segmented Digital Clock with Fixed-Width Character Slots -->
        <div id="live-clock">Loading clock...</div>
    </div>

    <footer>
        <ul class="footer-links">
            <li><a href="https://rorabina.github.io/">Home</a></li>
            <li><a href="https://rorabina.github.io/web-utilities.html">Web Utilities</a></li>
        </ul>
        <div class="copyright">&copy; Copyright 2026 Republic of Rabina - All Rights Reserved</div>
    </footer>

    <script>
        (function() {
            function updateClock() {
                const now = new Date();
                const options = { 
                    timeZone: "Asia/Manila", 
                    hour: "2-digit", 
                    minute: "2-digit", 
                    second: "2-digit", 
                    hour12: true 
                };
                const timeStr = new Intl.DateTimeFormat("en-US", options).format(now) + " PST";
                const el = document.getElementById("live-clock");
                if (el) {
                    // Wrap every character in a fixed-width span slot to prevent shifting
                    el.innerHTML = timeStr.split('').map(char => {
                        const isSpace = char === ' ';
                        const cssClass = isSpace ? 'char-slot space' : 'char-slot';
                        const displayChar = isSpace ? '&nbsp;' : char;
                        return `<span class="${cssClass}">${displayChar}</span>`;
                    }).join('');
                }
            }
            setInterval(updateClock, 1000);
            updateClock();
        })();
    </script>
</body>
</html>
