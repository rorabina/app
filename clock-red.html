<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Clock (Red)</title>
    <link rel="manifest" href="manifest.json">
    <!-- Import authentic segmented digital watch/calculator font from external stylesheet -->
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #e04c3e;
            --footer-color: #a6a99c;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        .clock-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 2vh, 18px);
            max-width: 100%;
        }

        /* Line 1: Main HH:MM:SS digits scaled for tight displays */
        .time-primary {
            font-family: 'DS-Digital', monospace;
            font-size: clamp(3.5rem, 18vw, 13rem);
            font-weight: bold;
            line-height: 0.95;
            letter-spacing: 0.03em;
            white-space: nowrap;
            text-align: center;
            text-shadow: 0 0 18px rgba(224, 76, 62, 0.25);
        }

        /* Line 2: Dedicated AM/PM + Time Zone row for tight screens */
        .time-meta {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            justify-content: center;
            gap: clamp(10px, 3vw, 24px);
            flex-wrap: wrap;
        }

        .ampm {
            font-family: 'DS-Digital', monospace;
            font-size: clamp(1.75rem, 6.5vw, 4rem);
            font-weight: bold;
            letter-spacing: 0.08em;
            line-height: 1;
            text-shadow: 0 0 12px rgba(224, 76, 62, 0.2);
        }

        .timezone {
            font-family: 'DS-Digital', monospace;
            font-size: clamp(1.25rem, 4.5vw, 2.75rem);
            letter-spacing: 0.08em;
            line-height: 1;
            opacity: 0.85;
            text-transform: uppercase;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            color: var(--footer-color);
            letter-spacing: 0.05em;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <main class="main-container">
        <div class="clock-wrapper" role="timer" aria-live="off">
            <div class="time-primary" id="clock-time">00:00:00</div>
            <div class="time-meta">
                <span class="ampm" id="clock-ampm">AM</span>
                <span class="timezone" id="clock-tz">UTC+8</span>
            </div>
        </div>
    </main>

    <footer id="clock-footer">Rorabina Clock</footer>

    <script>
        function getTimeZoneLabel(date) {
            try {
                const shortTz = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' })
                    .formatToParts(date)
                    .find(part => part.type === 'timeZoneName')?.value;
                if (shortTz) return shortTz;
            } catch (e) {}

            const offsetMinutes = -date.getTimezoneOffset();
            const sign = offsetMinutes >= 0 ? '+' : '-';
            const absHours = Math.floor(Math.abs(offsetMinutes) / 60);
            const absMins = Math.abs(offsetMinutes) % 60;
            return absMins === 0
                ? `UTC${sign}${absHours}`
                : `UTC${sign}${absHours}:${String(absMins).padStart(2, '0')}`;
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12;
            const formattedHours = String(hours).padStart(2, '0');

            document.getElementById('clock-time').textContent = `${formattedHours}:${minutes}:${seconds}`;
            document.getElementById('clock-ampm').textContent = ampm;
            document.getElementById('clock-tz').textContent = getTimeZoneLabel(now);
        }

        updateClock();
        setInterval(updateClock, 250);
    </script>
</body>
</html>
