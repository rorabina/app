<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Clock (Red)</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ff3333; /* Red glow theme */
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
        }

        /* Digital clock display styled similar to your digital aesthetic */
        #live-clock {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        footer {
            width: 100%;
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
        }

        .footer-links {
            display: flex;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .footer-links a {
            color: var(--text-color);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .footer-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .copyright {
            opacity: 0.6;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Live Clock with Seconds -->
        <div id="live-clock">Loading clock...</div>
    </div>

    <footer>
        <ul class="footer-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#">Web Utilities</a></li>
        </ul>
        <div class="copyright">&copy; Copyright 2026 Republic of Rabina - All Rights Reserved</div>
    </footer>

    <script src="sw-register.js"></script>
    <script>
        (function() {
            function updateClock() {
                const now = new Date();
                // Formats date and time including seconds with Asia/Manila timezone
                const options = { 
                    timeZone: "Asia/Manila", 
                    month: "short", 
                    day: "numeric", 
                    year: "numeric", 
                    hour: "numeric", 
                    minute: "2-digit", 
                    second: "2-digit", 
                    hour12: true 
                };
                const timeStr = new Intl.DateTimeFormat("en-US", options).format(now) + " PST";
                const el = document.getElementById("live-clock");
                if (el) el.innerHTML = timeStr;
            }
            setInterval(updateClock, 1000);
            updateClock();
        })();
    </script>
</body>
</html>
