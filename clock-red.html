<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Clock (Red)</title>
    <link rel="manifest" href="manifest.json">
    <style>
        @font-face {
            font-family: 'DS-Digital';
            src: url('assets/fonts/DS-DIGIT.woff2') format('woff2'),
                 url('assets/fonts/DS-DIGIT.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #000000;
            --text-color: #e04c3e;
            --footer-color: #a6a99c;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
        }

        /* Digital clock display using DS-DIGIT font with fallback */
        #live-clock {
            font-family: 'DS-Digital', monospace, sans-serif;
            font-size: clamp(3rem, 11vw, 7rem);
            font-weight: normal;
            letter-spacing: 3px;
            text-align: center;
            color: var(--text-color);
            text-shadow: 0 0 18px rgba(224, 76, 62, 0.45);
        }

        footer {
            width: 100%;
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(166, 169, 156, 0.2);
            background-color: rgba(0, 0, 0, 0.85);
            box-sizing: border-box;
            color: var(--footer-color);
        }

        .footer-links {
            display: flex;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .footer-links a {
            color: var(--footer-color);
            text-decoration: none;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .footer-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .copyright {
            color: var(--footer-color);
            opacity: 0.75;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Live Time-Only Clock with Seconds -->
        <div id="live-clock">Loading clock...</div>
    </div>

    <footer>
        <ul class="footer-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#">Web Utilities</a></li>
        </ul>
        <div class="copyright">&copy; Copyright 2026 Republic of Rabina - All Rights Reserved</div>
    </footer>

    <script>
        (function() {
            function updateClock() {
                const now = new Date();
                const options = { 
                    timeZone: "Asia/Manila", 
                    hour: "numeric", 
                    minute: "2-digit", 
                    second: "2-digit", 
                    hour12: true 
                };
                const timeStr = new Intl.DateTimeFormat("en-US", options).format(now) + " PST";
                const el = document.getElementById("live-clock");
                if (el) el.innerHTML = timeStr;
            }
            setInterval(updateClock, 1000);
            updateClock();
        })();
    </script>
</body>
</html>
