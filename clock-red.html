<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Clock (Red)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      background-color: #000000;
      color: #e53935;
      font-family: 'DSEG7-Classic', 'Courier New', monospace;
      font-style: normal;
      font-weight: 900;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding-top: calc(env(safe-area-inset-top, 0px) + clamp(1.75rem, 5dvh, 3rem));
      padding-right: calc(env(safe-area-inset-right, 0px) + clamp(1rem, 3vw, 2.25rem));
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(0.9rem, 2.5dvh, 1.75rem));
      padding-left: calc(env(safe-area-inset-left, 0px) + clamp(1rem, 3vw, 2.25rem));
    }

    .clock-container {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(0.4rem, 1.3dvh, 1rem);
      width: 100%;
      max-width: 100%;
    }

    /* Line 1: HH:MM:SS sized with safe vertical headroom */
    .time-main {
      font-size: clamp(2.2rem, min(12.5vw, 9.5dvh), 7.5rem);
      font-weight: 900;
      font-style: normal;
      letter-spacing: 0.06em;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow:
        0 0 2px rgba(229, 57, 53, 0.75),
        0 0 12px rgba(229, 57, 53, 0.25);
    }

    /* Line 2: AM/PM + Time Zone matching font size */
    .time-sub {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.65em;
      font-family: 'DSEG14-Classic', 'Courier New', monospace;
      font-size: clamp(1.2rem, min(5.5vw, 4.3dvh), 3.4rem);
      font-weight: 900;
      font-style: normal;
      letter-spacing: 0.1em;
      line-height: 1.15;
      text-shadow:
        0 0 1.5px rgba(229, 57, 53, 0.7),
        0 0 9px rgba(229, 57, 53, 0.2);
    }

    .time-sub span {
      font-size: inherit;
      font-style: normal;
      font-weight: 900;
      text-shadow: inherit;
    }

    /* Landscape / Horizontal & full-screen cutout clearance */
    @media (orientation: landscape) {
      body {
        padding-top: calc(env(safe-area-inset-top, 0px) + clamp(2rem, 6dvh, 3.25rem));
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(1rem, 3.5dvh, 2rem));
        padding-left: calc(env(safe-area-inset-left, 0px) + clamp(2rem, 5vw, 3.5rem));
        padding-right: calc(env(safe-area-inset-right, 0px) + clamp(2rem, 5vw, 3.5rem));
      }

      .clock-container {
        gap: clamp(0.35rem, 1.5dvh, 1rem);
      }

      .time-main {
        font-size: clamp(2.6rem, min(14vw, 24dvh), 9.5rem);
      }

      .time-sub {
        font-size: clamp(1.35rem, min(6.2vw, 10.5dvh), 4rem);
      }
    }

    /* Portrait orientation */
    @media (orientation: portrait) {
      body {
        padding-top: calc(env(safe-area-inset-top, 0px) + clamp(2.25rem, 7dvh, 3.75rem));
      }

      .time-main {
        font-size: clamp(2.2rem, min(12.2vw, 9dvh), 6.5rem);
      }

      .time-sub {
        font-size: clamp(1.2rem, min(5.4vw, 4.1dvh), 3rem);
      }
    }

    footer {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-style: normal;
      font-weight: 400;
      color: #9e9e9e;
      font-size: clamp(0.85rem, 2.4vw, 1rem);
      text-align: center;
      line-height: 1.45;
      flex-shrink: 0;
    }

    footer .footer-links {
      margin-bottom: 0.2rem;
    }

    footer a {
      color: #bdbdbd;
      text-decoration: none;
      margin: 0 0.6rem;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="clock-container">
    <div id="time-main" class="time-main">05:45:46</div>
    <div class="time-sub">
      <span id="ampm">AM</span>
      <span id="timezone">GMT+8</span>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="https://rorabina.github.io/">Rorabina</a>
      <a href="https://rorabina.github.io/web-utilities.html">Web Utilities</a>
    </div>
    <div>© Copyright 2026 Republic of Rabina - All Rights Reserved</div>
  </footer>

  <script>
    function updateClock() {
      const now = new Date();

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12;
      const hoursStr = String(hours).padStart(2, '0');

      const tzPart = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' })
        .formatToParts(now)
        .find(part => part.type === 'timeZoneName');
      const timeZone = tzPart ? tzPart.value : '';

      document.getElementById('time-main').textContent = `${hoursStr}:${minutes}:${seconds}`;
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('timezone').textContent = timeZone;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
