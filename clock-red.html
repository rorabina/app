<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Digital Clock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" />
  <style>
    :root {
      --clock-color: #e53935;
      --clock-glow-strong: rgba(229, 57, 53, 0.75);
      --clock-glow-soft: rgba(229, 57, 53, 0.25);
      --btn-border: rgba(229, 57, 53, 0.45);
      --btn-bg: rgba(229, 57, 53, 0.06);
      --btn-hover-bg: rgba(229, 57, 53, 0.18);
      --btn-hover-shadow: rgba(229, 57, 53, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      width: 100%;
    }

    body {
      background-color: #000000;
      color: var(--clock-color);
      font-family: 'DSEG7-Classic', 'Courier New', monospace;
      font-style: normal;
      font-weight: 900;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding:
        max(clamp(0.75rem, 3dvh, 2rem), env(safe-area-inset-top))
        max(clamp(0.75rem, 3vw, 2.5rem), env(safe-area-inset-right))
        max(clamp(0.75rem, 3dvh, 2rem), env(safe-area-inset-bottom))
        max(clamp(0.75rem, 3vw, 2.5rem), env(safe-area-inset-left));
      overflow-x: hidden;
      overscroll-behavior-y: auto;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(0.5rem, 2dvh, 1.35rem);
      width: 100%;
      max-width: 100%;
    }

    /* Line 1: Main HH:MM:SS */
    .time-main {
      font-size: clamp(2.8rem, min(15.5vw, 15dvh), 10rem);
      font-weight: 900;
      font-style: normal;
      letter-spacing: 0.06em;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow:
        0 0 2px var(--clock-glow-strong),
        0 0 12px var(--clock-glow-soft);
    }

    /* Line 2: AM/PM + Time Zone */
    .time-sub {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.65em;
      font-family: 'DSEG14-Classic', 'Courier New', monospace;
      font-size: clamp(1.5rem, min(7vw, 7dvh), 4.25rem);
      font-weight: 900;
      font-style: normal;
      letter-spacing: 0.1em;
      line-height: 1.15;
      text-shadow:
        0 0 1.5px var(--clock-glow-strong),
        0 0 9px var(--clock-glow-soft);
    }

    .time-sub span {
      font-size: inherit;
      font-style: normal;
      font-weight: 900;
      text-shadow: inherit;
    }

    /* Navigation & Action Buttons */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(0.85rem, 3.5vw, 1.5rem);
      margin-top: clamp(0.65rem, 2.5dvh, 1.5rem);
    }

    .control-btn {
      width: clamp(44px, 11vw, 54px);
      height: clamp(44px, 11vw, 54px);
      border-radius: 50%;
      border: 1.5px solid var(--btn-border);
      background-color: var(--btn-bg);
      color: var(--clock-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      outline: none;
      transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .control-btn:hover,
    .control-btn:focus-visible {
      background-color: var(--btn-hover-bg);
      border-color: var(--clock-color);
      box-shadow: 0 0 12px var(--btn-hover-shadow);
    }

    .control-btn:active {
      transform: scale(0.93);
    }

    .control-btn svg {
      width: clamp(20px, 5vw, 24px);
      height: clamp(20px, 5vw, 24px);
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Color Swatch Buttons: Red, Blue, Green, Yellow, White */
    .color-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.65rem, 2.5vw, 1.1rem);
      margin-top: clamp(0.45rem, 1.6dvh, 0.9rem);
    }

    .color-btn {
      width: clamp(26px, 6.5vw, 32px);
      height: clamp(26px, 6.5vw, 32px);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.28);
      background-color: var(--swatch-color);
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .color-btn:hover,
    .color-btn:focus-visible {
      transform: scale(1.08);
      border-color: #ffffff;
    }

    .color-btn.active {
      border-color: #ffffff;
      box-shadow: 0 0 10px var(--swatch-color);
      transform: scale(1.12);
    }

    .color-btn[data-color="red"]    { --swatch-color: #e53935; }
    .color-btn[data-color="blue"]   { --swatch-color: #29b6f6; }
    .color-btn[data-color="green"]  { --swatch-color: #00e676; }
    .color-btn[data-color="yellow"] { --swatch-color: #ffea00; }
    .color-btn[data-color="white"]  { --swatch-color: #ffffff; }

    /* Landscape / Horizontal orientation */
    @media (orientation: landscape) {
      body {
        padding:
          max(clamp(0.5rem, 2dvh, 1.25rem), env(safe-area-inset-top))
          max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-right))
          max(clamp(0.5rem, 2dvh, 1.25rem), env(safe-area-inset-bottom))
          max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-left));
      }

      .clock-container {
        gap: clamp(0.35rem, 1.8dvh, 1.1rem);
      }

      .time-main {
        font-size: clamp(3.5rem, min(17vw, 38dvh), 13.5rem);
      }

      .time-sub {
        font-size: clamp(1.75rem, min(7.5vw, 16dvh), 5.5rem);
      }

      .controls {
        margin-top: clamp(0.4rem, 1.8dvh, 1rem);
      }
    }

    /* Portrait orientation */
    @media (orientation: portrait) {
      .time-main {
        font-size: clamp(2.8rem, min(15.5vw, 13dvh), 8rem);
      }

      .time-sub {
        font-size: clamp(1.5rem, min(7vw, 6dvh), 3.75rem);
      }
    }

    /* Windows / Desktop Fullscreen: Slightly smaller than default without shrinking awkwardly */
    @media (hover: hover) and (pointer: fine) {
      :root:fullscreen .time-main,
      :root:-webkit-full-screen .time-main {
        font-size: clamp(3.2rem, min(15.5vw, 34dvh), 12rem);
      }

      :root:fullscreen .time-sub,
      :root:-webkit-full-screen .time-sub {
        font-size: clamp(1.55rem, min(6.8vw, 14.5dvh), 4.9rem);
      }
    }

    /* Android / Touch Fullscreen: Keep punch-hole clearance and slightly smaller scale */
    @media (hover: none) and (pointer: coarse) {
      :root:fullscreen body,
      :root:-webkit-full-screen body {
        padding-left: max(clamp(2.25rem, 5.5vw, 4rem), env(safe-area-inset-left));
        padding-right: max(clamp(2.25rem, 5.5vw, 4rem), env(safe-area-inset-right));
        overscroll-behavior-y: auto;
      }

      :root:fullscreen .clock-container,
      :root:-webkit-full-screen .clock-container {
        gap: clamp(0.3rem, 1.4dvh, 0.9rem);
      }

      :root:fullscreen .time-main,
      :root:-webkit-full-screen .time-main {
        font-size: clamp(2.6rem, min(14vw, 31dvh), 11rem);
      }

      :root:fullscreen .time-sub,
      :root:-webkit-full-screen .time-sub {
        font-size: clamp(1.35rem, min(6.2vw, 13dvh), 4.5rem);
      }

      :root:fullscreen .controls,
      :root:-webkit-full-screen .controls {
        gap: clamp(0.75rem, 3vw, 1.25rem);
        margin-top: clamp(0.35rem, 1.4dvh, 0.85rem);
      }

      :root:fullscreen .control-btn,
      :root:-webkit-full-screen .control-btn {
        width: clamp(40px, 9.5vw, 48px);
        height: clamp(40px, 9.5vw, 48px);
      }

      :root:fullscreen .control-btn svg,
      :root:-webkit-full-screen .control-btn svg {
        width: clamp(18px, 4.4vw, 21px);
        height: clamp(18px, 4.4vw, 21px);
      }

      :root:fullscreen .color-btn,
      :root:-webkit-full-screen .color-btn {
        width: clamp(22px, 5.5vw, 28px);
        height: clamp(22px, 5.5vw, 28px);
      }
    }
  </style>
</head>
<body>
  <main class="clock-container">
    <div id="time-main" class="time-main">05:20:51</div>
    <div class="time-sub">
      <span id="ampm">AM</span>
      <span id="timezone">GMT+8</span>
    </div>

    <nav class="controls" aria-label="Clock Controls">
      <!-- 1. Home Icon -> Main Website -->
      <a href="https://rorabina.github.io/" class="control-btn" title="Rorabina Home" aria-label="Rorabina Home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z" />
        </svg>
      </a>

      <!-- 2. Fullscreen + Landscape Lock Toggle -->
      <button type="button" id="fullscreen-btn" class="control-btn" title="Toggle Fullscreen Landscape" aria-label="Toggle Fullscreen Landscape">
        <svg id="fullscreen-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
        </svg>
      </button>

      <!-- 3. Grid Icon -> Web Utilities -->
      <a href="https://rorabina.github.io/web-utilities.html" class="control-btn" title="Web Utilities" aria-label="Web Utilities">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
      </a>
    </nav>

    <!-- 5 Color Switcher Buttons: Red, Blue, Green, Yellow, White -->
    <div class="color-controls" role="group" aria-label="Clock Color Selector">
      <button type="button" class="color-btn active" data-color="red" title="Red" aria-label="Red color"></button>
      <button type="button" class="color-btn" data-color="blue" title="Blue" aria-label="Blue color"></button>
      <button type="button" class="color-btn" data-color="green" title="Green" aria-label="Green color"></button>
      <button type="button" class="color-btn" data-color="yellow" title="Yellow" aria-label="Yellow color"></button>
      <button type="button" class="color-btn" data-color="white" title="White" aria-label="White color"></button>
    </div>
  </main>

  <script>
    // Anti-right-click / context menu guard
    document.addEventListener('contextmenu', (event) => {
      event.preventDefault();
    });

    // Disable pinch-in / pinch-out zoom while preserving vertical pull-to-refresh
    document.addEventListener('touchstart', (event) => {
      if (event.touches && event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('touchmove', (event) => {
      if (event.touches && event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });

    ['gesturestart', 'gesturechange', 'gestureend'].forEach((gestureEvent) => {
      document.addEventListener(gestureEvent, (event) => {
        event.preventDefault();
      }, { passive: false });
    });

    document.addEventListener('wheel', (event) => {
      if (event.ctrlKey) {
        event.preventDefault();
      }
    }, { passive: false });

    // Clock updater
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12;
      const hoursStr = String(hours).padStart(2, '0');

      const tzPart = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' })
        .formatToParts(now)
        .find(part => part.type === 'timeZoneName');
      const timeZone = tzPart ? tzPart.value : '';

      document.getElementById('time-main').textContent = `${hoursStr}:${minutes}:${seconds}`;
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('timezone').textContent = timeZone;
    }

    updateClock();
    setInterval(updateClock, 1000);

    // Color themes: Red, Blue, Green, Yellow, White
    const COLOR_THEMES = {
      red: {
        color: '#e53935',
        glowStrong: 'rgba(229, 57, 53, 0.75)',
        glowSoft: 'rgba(229, 57, 53, 0.25)',
        btnBorder: 'rgba(229, 57, 53, 0.45)',
        btnBg: 'rgba(229, 57, 53, 0.06)',
        btnHoverBg: 'rgba(229, 57, 53, 0.18)',
        btnHoverShadow: 'rgba(229, 57, 53, 0.35)'
      },
      blue: {
        color: '#29b6f6',
        glowStrong: 'rgba(41, 182, 246, 0.75)',
        glowSoft: 'rgba(41, 182, 246, 0.25)',
        btnBorder: 'rgba(41, 182, 246, 0.45)',
        btnBg: 'rgba(41, 182, 246, 0.06)',
        btnHoverBg: 'rgba(41, 182, 246, 0.18)',
        btnHoverShadow: 'rgba(41, 182, 246, 0.35)'
      },
      green: {
        color: '#00e676',
        glowStrong: 'rgba(0, 230, 118, 0.75)',
        glowSoft: 'rgba(0, 230, 118, 0.25)',
        btnBorder: 'rgba(0, 230, 118, 0.45)',
        btnBg: 'rgba(0, 230, 118, 0.06)',
        btnHoverBg: 'rgba(0, 230, 118, 0.18)',
        btnHoverShadow: 'rgba(0, 230, 118, 0.35)'
      },
      yellow: {
        color: '#ffea00',
        glowStrong: 'rgba(255, 234, 0, 0.75)',
        glowSoft: 'rgba(255, 234, 0, 0.25)',
        btnBorder: 'rgba(255, 234, 0, 0.45)',
        btnBg: 'rgba(255, 234, 0, 0.06)',
        btnHoverBg: 'rgba(255, 234, 0, 0.18)',
        btnHoverShadow: 'rgba(255, 234, 0, 0.35)'
      },
      white: {
        color: '#ffffff',
        glowStrong: 'rgba(255, 255, 255, 0.75)',
        glowSoft: 'rgba(255, 255, 255, 0.25)',
        btnBorder: 'rgba(255, 255, 255, 0.45)',
        btnBg: 'rgba(255, 255, 255, 0.06)',
        btnHoverBg: 'rgba(255, 255, 255, 0.18)',
        btnHoverShadow: 'rgba(255, 255, 255, 0.35)'
      }
    };

    const colorButtons = document.querySelectorAll('.color-btn');

    function applyColorTheme(themeKey) {
      const theme = COLOR_THEMES[themeKey] || COLOR_THEMES.red;
      const rootStyle = document.documentElement.style;

      rootStyle.setProperty('--clock-color', theme.color);
      rootStyle.setProperty('--clock-glow-strong', theme.glowStrong);
      rootStyle.setProperty('--clock-glow-soft', theme.glowSoft);
      rootStyle.setProperty('--btn-border', theme.btnBorder);
      rootStyle.setProperty('--btn-bg', theme.btnBg);
      rootStyle.setProperty('--btn-hover-bg', theme.btnHoverBg);
      rootStyle.setProperty('--btn-hover-shadow', theme.btnHoverShadow);

      colorButtons.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.color === themeKey);
      });

      try {
        localStorage.setItem('clockThemeColor', themeKey);
      } catch (_) {}
    }

    colorButtons.forEach((btn) => {
      btn.addEventListener('click', () => applyColorTheme(btn.dataset.color));
    });

    try {
      const savedTheme = localStorage.getItem('clockThemeColor');
      if (savedTheme && COLOR_THEMES[savedTheme]) {
        applyColorTheme(savedTheme);
      }
    } catch (_) {}

    // Fullscreen + Android Landscape Orientation Toggle
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const fullscreenIcon = document.getElementById('fullscreen-icon');
    const expandPath = 'M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3';
    const compressPath = 'M4 14h6v6m10-10h-6V4m0 6l7-7M3 21l7-7';

    function isCurrentlyFullscreen() {
      return Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      );
    }

    async function enterFullscreenSafely() {
      const docEl = document.documentElement;
      const requestFn =
        docEl.requestFullscreen ||
        docEl.webkitRequestFullscreen ||
        docEl.mozRequestFullScreen ||
        docEl.msRequestFullscreen;

      if (requestFn) {
        await requestFn.call(docEl);
      }

      if (screen.orientation && typeof screen.orientation.lock === 'function') {
        try {
          await screen.orientation.lock('landscape');
        } catch (_) {}
      }
    }

    async function exitFullscreenSafely() {
      if (screen.orientation && typeof screen.orientation.unlock === 'function') {
        try {
          screen.orientation.unlock();
        } catch (_) {}
      }

      const exitFn =
        document.exitFullscreen ||
        document.webkitExitFullscreen ||
        document.mozCancelFullScreen ||
        document.msExitFullscreen;

      if (exitFn) {
        await exitFn.call(document);
      }
    }

    async function toggleFullscreenLandscape() {
      try {
        if (!isCurrentlyFullscreen()) {
          await enterFullscreenSafely();
        } else {
          await exitFullscreenSafely();
        }
      } catch (err) {
        console.warn('Fullscreen toggle failed:', err);
      } finally {
        syncFullscreenIcon();
      }
    }

    function syncFullscreenIcon() {
      const active = isCurrentlyFullscreen();
      fullscreenIcon.innerHTML = `<path d="${active ? compressPath : expandPath}" />`;
    }

    fullscreenBtn.addEventListener('click', toggleFullscreenLandscape);
    document.addEventListener('fullscreenchange', syncFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', syncFullscreenIcon);
    document.addEventListener('mozfullscreenchange', syncFullscreenIcon);
    document.addEventListener('MSFullscreenChange', syncFullscreenIcon);
  </script>
</body>
</html>
