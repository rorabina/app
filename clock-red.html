<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Clock (Red)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            background-color: #000000;
            color: #e53935;
            font-family: 'DSEG7-Classic', 'Courier New', monospace;
            font-style: normal;
            font-weight: 900;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding:
                max(0.75rem, env(safe-area-inset-top))
                max(1rem, env(safe-area-inset-right))
                max(0.75rem, env(safe-area-inset-bottom))
                max(1rem, env(safe-area-inset-left));
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: clamp(0.45rem, 1.8dvh, 1.25rem);
            width: 100%;
            max-width: 100%;
        }

        /* Line 1: Main HH:MM:SS */
        .time-main {
            font-size: clamp(2.5rem, min(14vw, 13.5dvh), 9rem);
            font-weight: 900;
            font-style: normal;
            letter-spacing: 0.06em;
            line-height: 1.05;
            white-space: nowrap;
            text-shadow: 0 0 2px rgba(229, 57, 53, 0.75), 0 0 12px rgba(229, 57, 53, 0.25);
        }

        /* Line 2: AM/PM + Time Zone */
        .time-sub {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.65em;
            font-family: 'DSEG14-Classic', 'Courier New', monospace;
            font-size: clamp(1.35rem, min(6.2vw, 6.2dvh), 3.75rem);
            font-weight: 900;
            font-style: normal;
            letter-spacing: 0.1em;
            line-height: 1.15;
            text-shadow: 0 0 1.5px rgba(229, 57, 53, 0.7), 0 0 9px rgba(229, 57, 53, 0.2);
        }

        .time-sub span {
            font-size: inherit;
            font-style: normal;
            font-weight: 900;
            text-shadow: inherit;
        }

        /* Three Round Control Buttons */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(0.9rem, 3.5vw, 1.6rem);
            margin-top: clamp(0.5rem, 2dvh, 1.25rem);
        }

        .control-btn {
            width: clamp(40px, 9.5vw, 50px);
            height: clamp(40px, 9.5vw, 50px);
            border-radius: 50%;
            border: 1.5px solid rgba(229, 57, 53, 0.45);
            background-color: rgba(229, 57, 53, 0.06);
            color: #e53935;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            outline: none;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:hover,
        .control-btn:focus-visible {
            background-color: rgba(229, 57, 53, 0.18);
            border-color: #e53935;
            box-shadow: 0 0 12px rgba(229, 57, 53, 0.35);
        }

        .control-btn:active {
            transform: scale(0.93);
        }

        .control-btn svg {
            width: clamp(18px, 4.5vw, 22px);
            height: clamp(18px, 4.5vw, 22px);
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Landscape / Horizontal orientation */
        @media (orientation: landscape) {
            body {
                padding:
                    max(0.75rem, env(safe-area-inset-top))
                    max(2.75rem, calc(env(safe-area-inset-right) + 1.5rem))
                    max(0.75rem, env(safe-area-inset-bottom))
                    max(2.75rem, calc(env(safe-area-inset-left) + 1.5rem));
            }
            .clock-container {
                gap: clamp(0.3rem, 1.5dvh, 0.9rem);
            }
            .time-main {
                font-size: clamp(2.8rem, min(13vw, 30dvh), 10.5rem);
            }
            .time-sub {
                font-size: clamp(1.4rem, min(5.8vw, 13dvh), 4.25rem);
            }
            .controls {
                margin-top: clamp(0.35rem, 1.5dvh, 0.85rem);
            }
        }

        /* Portrait orientation: extra top clearance for top-center punch holes */
        @media (orientation: portrait) {
            body {
                padding-top: max(2.25rem, calc(env(safe-area-inset-top) + 1.25rem));
            }
            .time-main {
                font-size: clamp(2.35rem, min(12.8vw, 9.5dvh), 6.75rem);
            }
            .time-sub {
                font-size: clamp(1.25rem, min(5.6vw, 4.4dvh), 3.1rem);
            }
        }

        /* Explicit Fullscreen Mode: slightly scaled down so edges never touch punch holes */
        :fullscreen body,
        :-webkit-full-screen body {
            padding:
                max(1rem, calc(env(safe-area-inset-top) + 0.75rem))
                max(3.5rem, calc(env(safe-area-inset-right) + 2.25rem))
                max(1rem, calc(env(safe-area-inset-bottom) + 0.75rem))
                max(3.5rem, calc(env(safe-area-inset-left) + 2.25rem));
        }

        :fullscreen .time-main,
        :-webkit-full-screen .time-main {
            font-size: clamp(2.4rem, min(11.5vw, 26dvh), 9.25rem);
        }

        :fullscreen .time-sub,
        :-webkit-full-screen .time-sub {
            font-size: clamp(1.2rem, min(5vw, 11.5dvh), 3.75rem);
        }

        :fullscreen .control-btn,
        :-webkit-full-screen .control-btn {
            width: clamp(36px, 8vw, 44px);
            height: clamp(36px, 8vw, 44px);
        }

        :fullscreen .control-btn svg,
        :-webkit-full-screen .control-btn svg {
            width: clamp(16px, 3.8vw, 20px);
            height: clamp(16px, 3.8vw, 20px);
        }
    </style>
</head>
<body>
    <main class="clock-container">
        <div id="time-main" class="time-main">05:20:51</div>
        <div class="time-sub">
            <span id="ampm">AM</span>
            <span id="timezone">GMT+8</span>
        </div>

        <nav class="controls" aria-label="Clock Controls">
            <!-- 1. Home Icon -> Main Website -->
            <a href="https://rorabina.github.io/" class="control-btn" title="Rorabina Home" aria-label="Rorabina Home">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z" />
                </svg>
            </a>

            <!-- 2. Fullscreen + Landscape Lock Toggle -->
            <button type="button" id="fullscreen-btn" class="control-btn" title="Toggle Fullscreen Landscape" aria-label="Toggle Fullscreen Landscape">
                <svg id="fullscreen-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                </svg>
            </button>

            <!-- 3. Grid Icon -> Web Utilities -->
            <a href="https://rorabina.github.io/web-utilities.html" class="control-btn" title="Web Utilities" aria-label="Web Utilities">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1.5" />
                    <rect x="14" y="3" width="7" height="7" rx="1.5" />
                    <rect x="3" y="14" width="7" height="7" rx="1.5" />
                    <rect x="14" y="14" width="7" height="7" rx="1.5" />
                </svg>
            </a>
        </nav>
    </main>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            const tzPart = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' })
                .formatToParts(now)
                .find(part => part.type === 'timeZoneName');
            const timeZone = tzPart ? tzPart.value : '';

            document.getElementById('time-main').textContent = `${hoursStr}:${minutes}:${seconds}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('timezone').textContent = timeZone;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // Fullscreen + Android Landscape Orientation Toggle
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const fullscreenIcon = document.getElementById('fullscreen-icon');

        const expandPath = 'M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3';
        const compressPath = 'M4 14h6v6m10-10h-6V4m0 6l7-7M3 21l7-7';

        async function toggleFullscreenLandscape() {
            const docEl = document.documentElement;
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

            if (!isFullscreen) {
                try {
                    if (docEl.requestFullscreen) {
                        await docEl.requestFullscreen();
                    } else if (docEl.webkitRequestFullscreen) {
                        await docEl.webkitRequestFullscreen();
                    }

                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(() => {});
                    }
                } catch (err) {
                    console.warn('Fullscreen request failed:', err);
                }
            } else {
                try {
                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        await document.webkitExitFullscreen();
                    }
                } catch (err) {
                    console.warn('Exit fullscreen failed:', err);
                }
            }
        }

        function syncFullscreenIcon() {
            const isFullscreen = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
            fullscreenIcon.innerHTML = `<path d="${isFullscreen ? compressPath : expandPath}" />`;
        }

        fullscreenBtn.addEventListener('click', toggleFullscreenLandscape);
        document.addEventListener('fullscreenchange', syncFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', syncFullscreenIcon);
    </script>
</body>
</html>
