<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock (Red)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      background-color: #000000;
      color: #e53935;
      font-family: 'DSEG7-Classic', 'Courier New', monospace;
      font-style: normal;
      font-weight: 900;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(0.6rem, 2dvh, 1.5rem) clamp(0.75rem, 2.5vw, 2rem);
    }

    .clock-container {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(0.45rem, 1.5dvh, 1.25rem);
      width: 100%;
      max-width: 100%;
    }

    /* Line 1: Larger HH:MM:SS */
    .time-main {
      font-size: clamp(2.8rem, min(14.5vw, 13dvh), 9rem);
      font-weight: 900;
      font-style: normal;
      letter-spacing: 0.06em;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow:
        0 0 2px rgba(229, 57, 53, 0.75),
        0 0 12px rgba(229, 57, 53, 0.25);
    }

    /* Line 2: Larger AM/PM + Time Zone at matching size */
    .time-sub {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.65em;
      font-family: 'DSEG14-Classic', 'Courier New', monospace;
      font-size: clamp(1.5rem, min(6.5vw, 6dvh), 4rem);
      font-weight: 900;
      font-style: normal;
      letter-spacing: 0.1em;
      line-height: 1.15;
      text-shadow:
        0 0 1.5px rgba(229, 57, 53, 0.7),
        0 0 9px rgba(229, 57, 53, 0.2);
    }

    .time-sub span {
      font-size: inherit;
      font-style: normal;
      font-weight: 900;
      text-shadow: inherit;
    }

    /* Landscape / Horizontal orientation: fill most of the display */
    @media (orientation: landscape) {
      body {
        padding: clamp(0.5rem, 2dvh, 1.25rem) clamp(1rem, 3vw, 2.5rem);
      }

      .clock-container {
        gap: clamp(0.4rem, 2dvh, 1.25rem);
      }

      .time-main {
        font-size: clamp(3.5rem, min(16.5vw, 36dvh), 13rem);
      }

      .time-sub {
        font-size: clamp(1.75rem, min(7.5vw, 16dvh), 5.5rem);
      }
    }

    /* Portrait orientation: keep generous size while preserving room for footer */
    @media (orientation: portrait) {
      .time-main {
        font-size: clamp(2.8rem, min(14.5vw, 11.5dvh), 7.5rem);
      }

      .time-sub {
        font-size: clamp(1.5rem, min(6.5vw, 5.2dvh), 3.5rem);
      }
    }

    footer {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-style: normal;
      font-weight: 400;
      color: #9e9e9e;
      font-size: clamp(0.85rem, 2.4vw, 1rem);
      text-align: center;
      line-height: 1.45;
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    footer .footer-links {
      margin-bottom: 0.2rem;
    }

    footer a {
      color: #bdbdbd;
      text-decoration: none;
      margin: 0 0.6rem;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="clock-container">
    <div id="time-main" class="time-main">05:20:51</div>
    <div class="time-sub">
      <span id="ampm">AM</span>
      <span id="timezone">GMT+8</span>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="https://rorabina.github.io/">Rorabina</a>
      <a href="https://rorabina.github.io/web-utilities.html">Web Utilities</a>
    </div>
    <div>© Copyright 2026 Republic of Rabina - All Rights Reserved</div>
  </footer>

  <script>
    function updateClock() {
      const now = new Date();

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12;
      const hoursStr = String(hours).padStart(2, '0');

      const tzPart = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' })
        .formatToParts(now)
        .find(part => part.type === 'timeZoneName');
      const timeZone = tzPart ? tzPart.value : '';

      document.getElementById('time-main').textContent = `${hoursStr}:${minutes}:${seconds}`;
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('timezone').textContent = timeZone;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
