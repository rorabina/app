<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Clock (Red)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      background-color: #000000;
      color: #e53935;
      font-family: 'DSEG7-Classic', 'Courier New', monospace;
      font-style: normal;
      font-weight: 900;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding-top: calc(env(safe-area-inset-top, 0px) + clamp(1.75rem, 5dvh, 3rem));
      padding-right: calc(env(safe-area-inset-right, 0px) + clamp(1rem, 3vw, 2.25rem));
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(0.9rem, 2.5dvh, 1.75rem));
      padding-left: calc(env(safe-area-inset-left, 0px) + clamp(1rem, 3vw, 2.25rem));
    }

    .clock-container {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(0.45rem, 1.4dvh, 1.1rem);
      width: 100%;
      max-width: 100%;
    }

    /* Line 1: HH:MM:SS */
    .time-main {
      font-size: clamp(2.2rem, min(12.5vw, 9.5dvh), 7.5rem);
      font-weight: 900;
      font-style: normal;
      letter-spacing: 0.06em;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow:
        0 0 2px rgba(229, 57, 53, 0.75),
        0 0 12px rgba(229, 57, 53, 0.25);
    }

    /* Line 2: AM/PM + Time Zone at matching font size */
    .time-sub {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.65em;
      font-family: 'DSEG14-Classic', 'Courier New', monospace;
      font-size: clamp(1.2rem, min(5.5vw, 4.3dvh), 3.4rem);
      font-weight: 900;
      font-style: normal;
      letter-spacing: 0.1em;
      line-height: 1.15;
      text-shadow:
        0 0 1.5px rgba(229, 57, 53, 0.7),
        0 0 9px rgba(229, 57, 53, 0.2);
    }

    .time-sub span {
      font-size: inherit;
      font-style: normal;
      font-weight: 900;
      text-shadow: inherit;
    }

    body.no-glow .time-main,
    body.no-glow .time-sub,
    body.no-glow .time-sub span {
      text-shadow: none;
    }

    /* Control Buttons */
    .controls {
      margin-top: clamp(0.5rem, 1.5dvh, 1rem);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .ctrl-btn {
      background: rgba(229, 57, 53, 0.08);
      color: #e53935;
      border: 1px solid rgba(229, 57, 53, 0.45);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font-size: clamp(0.75rem, 2.2vw, 0.85rem);
      font-weight: 600;
      font-style: normal;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .ctrl-btn:hover,
    .ctrl-btn.active {
      background: #e53935;
      color: #000000;
      border-color: #e53935;
    }

    /* Landscape / Horizontal orientation */
    @media (orientation: landscape) {
      body {
        padding-top: calc(env(safe-area-inset-top, 0px) + clamp(2rem, 6dvh, 3.25rem));
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(1rem, 3.5dvh, 2rem));
        padding-left: calc(env(safe-area-inset-left, 0px) + clamp(2rem, 5vw, 3.5rem));
        padding-right: calc(env(safe-area-inset-right, 0px) + clamp(2rem, 5vw, 3.5rem));
      }

      .time-main {
        font-size: clamp(2.6rem, min(14vw, 24dvh), 9.5rem);
      }

      .time-sub {
        font-size: clamp(1.35rem, min(6.2vw, 10.5dvh), 4rem);
      }
    }

    /* Portrait orientation */
    @media (orientation: portrait) {
      body {
        padding-top: calc(env(safe-area-inset-top, 0px) + clamp(2.25rem, 7dvh, 3.75rem));
      }

      .time-main {
        font-size: clamp(2.2rem, min(12.2vw, 9dvh), 6.5rem);
      }

      .time-sub {
        font-size: clamp(1.2rem, min(5.4vw, 4.1dvh), 3rem);
      }
    }

    footer {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-style: normal;
      font-weight: 400;
      color: #9e9e9e;
      font-size: clamp(0.85rem, 2.4vw, 1rem);
      text-align: center;
      line-height: 1.45;
      flex-shrink: 0;
    }

    footer .footer-links {
      margin-bottom: 0.2rem;
    }

    footer a {
      color: #bdbdbd;
      text-decoration: none;
      margin: 0 0.6rem;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="clock-container">
    <div id="time-main" class="time-main">05:52:48</div>
    <div class="time-sub">
      <span id="ampm">AM</span>
      <span id="timezone">GMT+8</span>
    </div>

    <div class="controls" aria-label="Clock controls">
      <button type="button" id="btn-format" class="ctrl-btn">24H</button>
      <button type="button" id="btn-glow" class="ctrl-btn active">Glow</button>
      <button type="button" id="btn-fullscreen" class="ctrl-btn">Fullscreen</button>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="https://rorabina.github.io/">Rorabina</a>
      <a href="https://rorabina.github.io/web-utilities.html">Web Utilities</a>
    </div>
    <div>© Copyright 2026 Republic of Rabina - All Rights Reserved</div>
  </footer>

  <script>
    let is24Hour = false;
    const formatBtn = document.getElementById('btn-format');
    const glowBtn = document.getElementById('btn-glow');
    const fullscreenBtn = document.getElementById('btn-fullscreen');
    const ampmEl = document.getElementById('ampm');

    formatBtn.addEventListener('click', () => {
      is24Hour = !is24Hour;
      formatBtn.textContent = is24Hour ? '12H' : '24H';
      formatBtn.classList.toggle('active', is24Hour);
      updateClock();
    });

    glowBtn.addEventListener('click', () => {
      document.body.classList.toggle('no-glow');
      const glowOn = !document.body.classList.contains('no-glow');
      glowBtn.classList.toggle('active', glowOn);
    });

    fullscreenBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.textContent = 'Exit Fullscreen';
          fullscreenBtn.classList.add('active');
        } else {
          await document.exitFullscreen();
          fullscreenBtn.textContent = 'Fullscreen';
          fullscreenBtn.classList.remove('active');
        }
      } catch (err) {
        console.warn('Fullscreen request not available:', err);
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const active = Boolean(document.fullscreenElement);
      fullscreenBtn.textContent = active ? 'Exit Fullscreen' : 'Fullscreen';
      fullscreenBtn.classList.toggle('active', active);
    });

    function updateClock() {
      const now = new Date();

      let rawHours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const tzPart = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' })
        .formatToParts(now)
        .find(part => part.type === 'timeZoneName');
      const timeZone = tzPart ? tzPart.value : '';

      if (is24Hour) {
        const hoursStr = String(rawHours).padStart(2, '0');
        document.getElementById('time-main').textContent = `${hoursStr}:${minutes}:${seconds}`;
        ampmEl.textContent = '24H';
      } else {
        const ampm = rawHours >= 12 ? 'PM' : 'AM';
        let hours12 = rawHours % 12;
        hours12 = hours12 ? hours12 : 12;
        const hoursStr = String(hours12).padStart(2, '0');
        document.getElementById('time-main').textContent = `${hoursStr}:${minutes}:${seconds}`;
        ampmEl.textContent = ampm;
      }

      document.getElementById('timezone').textContent = timeZone;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
