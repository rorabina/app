<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock (Red)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    body {
      background-color: #000000;
      color: #e53935;
      font-family: 'DSEG7-Classic', 'Courier New', monospace;
      font-style: normal;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(0.75rem, 3vh, 1.5rem);
    }

    .clock-container {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(0.4rem, 1.5vh, 1rem);
      width: 100%;
      max-width: 100%;
    }

    /* Line 1: Bold, upright HH:MM:SS */
    .time-main {
      font-size: clamp(2.25rem, 12.5vw, 7.5rem);
      font-weight: bold;
      font-style: normal;
      letter-spacing: 0.06em;
      line-height: 1.05;
      white-space: nowrap;
    }

    /* Line 2: Bold, upright AM/PM + Time Zone at matching size */
    .time-sub {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.6em;
      font-family: 'DSEG14-Classic', 'Courier New', monospace;
      font-size: clamp(1.25rem, 5.5vw, 3.2rem);
      font-weight: bold;
      font-style: normal;
      letter-spacing: 0.1em;
      line-height: 1.15;
    }

    .time-sub span {
      font-size: inherit;
      font-style: normal;
      font-weight: bold;
    }

    /* Footer locked cleanly within the viewport */
    footer {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-style: normal;
      font-weight: normal;
      color: #9e9e9e;
      font-size: clamp(0.75rem, 2.2vw, 0.85rem);
      text-align: center;
      line-height: 1.5;
      flex-shrink: 0;
    }

    footer .footer-links {
      margin-bottom: 0.2rem;
    }

    footer a {
      color: #bdbdbd;
      text-decoration: none;
      margin: 0 0.6rem;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="clock-container">
    <div id="time-main" class="time-main">05:04:00</div>
    <div class="time-sub">
      <span id="ampm">AM</span>
      <span id="timezone">PST</span>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="https://rorabina.github.io/">Rorabina</a>
      <a href="https://rorabina.github.io/web-utilities.html">Web Utilities</a>
    </div>
    <div>© Copyright 2026 Republic of Rabina - All Rights Reserved</div>
  </footer>

  <script>
    function updateClock() {
      const now = new Date();

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12;
      const hoursStr = String(hours).padStart(2, '0');

      const tzPart = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' })
        .formatToParts(now)
        .find(part => part.type === 'timeZoneName');
      const timeZone = tzPart ? tzPart.value : '';

      document.getElementById('time-main').textContent = `${hoursStr}:${minutes}:${seconds}`;
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('timezone').textContent = timeZone;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
