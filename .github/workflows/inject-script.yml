name: Inject Script into HTML

on:
  push:
    branches:
      - gh-pages

# Cancels running builds if a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inject-js:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject script tag into clock.html
        run: |
          if ! grep -q 'clock.js' clock.html; then
            sed -i 's|</body>|<script src="assets/clock.js"></script>\n</body>|i' clock.html
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clock.html
          # [skip ci] prevents the bot's push from triggering another workflow run
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto-inject clock.js script [skip ci]" && git push)
